[custom]
; ========================
; 1. 规则集配置 (Ruleset)
; ========================
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ========================
; 2. 策略组配置 (纯手动选择，无自动测速)
; ========================
custom_proxy_group=🚀 节点选择`select`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌐 其他节点`[]DIRECT`.*
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

; 按地区划分的纯手动节点组
custom_proxy_group=🇭🇰 香港节点`select`(港|HK|Hong Kong|HKG)
custom_proxy_group=🇯🇵 日本节点`select`(日|JP|Japan|NRT|KIX|FUK)
custom_proxy_group=🇰🇷 韩国节点`select`(韩|KR|Korea|ICN)
custom_proxy_group=🇹🇼 台湾节点`select`(台|TW|Taiwan|TPE)
custom_proxy_group=🇸🇬 新加坡节点`select`(坡|狮城|SG|Singapore|SIN)
custom_proxy_group=🇺🇸 美国节点`select`(美|US|United States|SJC|LAX|SEA)
custom_proxy_group=🌐 其他节点`select`^(?!.*(港|HK|Hong Kong|HKG|日|JP|Japan|NRT|KIX|FUK|韩|KR|Korea|ICN|台|TW|Taiwan|TPE|坡|狮城|SG|Singapore|SIN|美|US|United States|SJC|LAX|SEA)).*

; ========================
; 3. 全局规则参数
; ========================
enable_rule_generator=true
overwrite_original_rules=true
